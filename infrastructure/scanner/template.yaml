AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Kavach Scanner Pipeline — Lambda, Step Functions, Fargate, DynamoDB, S3

Parameters:
  SandboxImageUri:
    Type: String
  LambdaImageUri:
    Type: String
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
  SandboxSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Globals:
  Function:
    Timeout: 180
    MemorySize: 512
    Environment:
      Variables:
        SCANNER_BUCKET: !Ref ArtifactBucket
        ARTIFACTS_TABLE: !Ref ArtifactsTable
        FINDINGS_TABLE: !Ref FindingsTable
        VERDICTS_TABLE: !Ref VerdictsTable
        SANDBOX_RESULTS_TABLE: !Ref SandboxResultsTable
        FARGATE_CLUSTER_ARN: !GetAtt SandboxCluster.Arn
        FARGATE_TASK_DEF_ARN: !Ref SandboxTaskDefinition
        FARGATE_SUBNET_ID: !Ref PrivateSubnetId
        FARGATE_SECURITY_GROUP_ID: !Ref SandboxSecurityGroupId

Resources:

  # ------------------------------------------------------------------ #
  # S3
  # ------------------------------------------------------------------ #
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQuarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 7

  # ------------------------------------------------------------------ #
  # DynamoDB
  # ------------------------------------------------------------------ #
  ArtifactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artifact_id
          AttributeType: S
        - AttributeName: source_url
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: artifact_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SourceUrlIndex
          KeySchema:
            - AttributeName: source_url
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artifact_id
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: artifact_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  VerdictsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artifact_id
          AttributeType: S
      KeySchema:
        - AttributeName: artifact_id
          KeyType: HASH

  SandboxResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: artifact_id
          AttributeType: S
      KeySchema:
        - AttributeName: artifact_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ------------------------------------------------------------------ #
  # IAM — Fargate roles
  # ------------------------------------------------------------------ #
  SandboxTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  SandboxTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SandboxTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/quarantine/*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt SandboxResultsTable.Arn

  # ------------------------------------------------------------------ #
  # ECS Fargate
  # ------------------------------------------------------------------ #
  SandboxCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: kavach-sandbox-cluster

  SandboxTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kavach-sandbox
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt SandboxTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt SandboxTaskRole.Arn
      ContainerDefinitions:
        - Name: sandbox
          Image: !Ref SandboxImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          User: "65534"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /kavach/sandbox
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: sandbox

  SandboxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /kavach/sandbox
      RetentionInDays: 7

  # ------------------------------------------------------------------ #
  # Lambda — Pipeline (no API event, no cycle)
  # ------------------------------------------------------------------ #
  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref LambdaImageUri
      ImageConfig:
        Command: ["scanner.pipeline.handler.handler"]
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArtifactsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VerdictsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SandboxResultsTable
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - Statement:
            - Effect: Allow
              Action:
                - ecs:RunTask
                - ecs:DescribeTasks
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                - !GetAtt SandboxTaskExecutionRole.Arn
                - !GetAtt SandboxTaskRole.Arn

  # ------------------------------------------------------------------ #
  # Step Functions — depends only on PipelineFunction
  # ------------------------------------------------------------------ #
  ScannerStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: stepfunctions.json
      DefinitionSubstitutions:
        PipelineLambdaArn: !GetAtt PipelineFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PipelineFunction

  # ------------------------------------------------------------------ #
  # Lambda — Gateway (depends on StateMachine via DependsOn)
  # ------------------------------------------------------------------ #
  GatewayFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScannerStateMachine
    Properties:
      PackageType: Image
      ImageUri: !Ref LambdaImageUri
      ImageConfig:
        Command: ["scanner.gateway.handler.handler"]
      Environment:
        Variables:
          PIPELINE_STATE_MACHINE_ARN: !Ref ScannerStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArtifactsTable
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref ScannerStateMachine
      Events:
        ScanApi:
          Type: Api
          Properties:
            Path: /artifacts/scan
            Method: post

  # ------------------------------------------------------------------ #
  # Lambda — Status
  # ------------------------------------------------------------------ #
  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref LambdaImageUri
      ImageConfig:
        Command: ["scanner.gateway.status.handler"]
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ArtifactsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VerdictsTable
      Events:
        StatusApi:
          Type: Api
          Properties:
            Path: /artifacts/{artifact_id}
            Method: get

Outputs:
  ScannerApiUrl:
    Description: Scanner API base URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ScanApiUrl:
    Description: Artifact scan endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/artifacts/scan"
  StatusApiUrl:
    Description: Artifact status endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/artifacts/{artifact_id}"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  StateMachineArn:
    Value: !Ref ScannerStateMachine
  SandboxClusterArn:
    Value: !GetAtt SandboxCluster.Arn
  SandboxTaskDefinitionArn:
    Value: !Ref SandboxTaskDefinition
